version: 2.1

orbs:
  python: circleci/python@2

jobs:
  run-bot:
    docker:
      # Menggunakan image dengan browser untuk Selenium
      - image: cimg/python:3.10-browsers
    steps:
      - checkout
      
      # Instalasi library dari requirements.txt
      - python/install-packages:
          pkg-manager: pip
      
      # Cek IP (biar kamu bisa lihat IP-nya ganti di Log) dan Jalankan Bot
      - run:
          name: Cek IP dan Jalankan Bot
          command: |
            echo "IP Publik saat ini:"
            curl ifconfig.me
            echo -e "\n----------------------------"
            # Ganti 'bot.py' jika nama file kamu berbeda
            python bot.py

workflows:
  # 1. Jalan otomatis setiap kali kamu edit/push kode
  on_commit:
    jobs:
      - run-bot

  # 2. Rerun otomatis terjadwal (IP Berganti setiap sesi)
  per_15_menit:
    triggers:
      - schedule:
          # Format Cron: "Menit Jam Hari Bulan Hari_Minggu"
          # "*/15 * * * *" artinya setiap 15 menit
          cron: "*/15 * * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - run-bot
