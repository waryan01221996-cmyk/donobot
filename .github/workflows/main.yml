name: Manual Mode

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    # 🌟 BARIS BARU: Menginstal komponen layar virtual di server Ubuntu Github Actions
    - name: Install Virtual Display (Xvfb)
      run: |
        sudo apt-get install -y xvfb

    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager

    # 🌟 BARIS BARU: Menjalankan skrip Python di dalam bungkus layar virtual xvfb
    - name: Run bot
      run: |
        xvfb-run --server-args="-screen 0 1920x1080x24" python -u bot.py

    - name: Hapus Riwayat Workflows Lama (Sukses & Gagal)
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 1

    # 🌟 FIX ERROR 404: Mengubah pemicu rerun otomatis ke file 'manual.yml' yang benar
    - name: Trigger Rerun Otomatis
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔄 Memulai ulang workflow secara otomatis..."
        gh workflow run manual.yml --ref ${{ github.ref_name }}
